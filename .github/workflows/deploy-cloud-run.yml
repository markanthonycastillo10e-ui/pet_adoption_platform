name: Deploy to Google Cloud Run

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm ci

      - name: Run tests
        run: |
          npm test -- --runInBand

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      - name: Build container with Cloud Build
        run: |
          gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT }}/pet-adoption-backend backend

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy pet-adoption-backend \
            --image gcr.io/${{ secrets.GCP_PROJECT }}/pet-adoption-backend \
            --region=${{ secrets.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars MONGO_URI="${{ secrets.MONGO_URI }}",PORT=8080

      - name: Output service URL
        run: gcloud run services describe pet-adoption-backend --region=${{ secrets.GCP_REGION }} --format="value(status.url)"

# Required repository secrets:
# - GCP_PROJECT: your Google Cloud project id
# - GCP_REGION: region for Cloud Run (e.g. us-central1)
# - GCP_SA_KEY: JSON service account key (put the _entire_ JSON here)
# - MONGO_URI: MongoDB connection string accessible from Cloud Run
